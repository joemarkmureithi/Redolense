async function aiCall(system,messages,max_tokens=1000){
  const res=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system,messages,max_tokens})});
  if(!res.ok)throw new Error(`Proxy ${res.status}`);
  const data=await res.json();
  return data.content?.[0]?.text||"";
}

function barchart(data,vk,lk,col,h){
  if(!data.length)return`<div style="height:${h}px;display:flex;align-items:center;justify-content:center;color:var(--t1);font-size:12px">No data yet</div>`;
  const W=500,pL=28,pB=28,pT=8,pR=8,cW=W-pL-pR,cH=h-pT-pB,max=Math.max(...data.map(d=>d[vk]||0),1);
  const bW=(cW/data.length)*.65,bG=cW/data.length;
  let s=`<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px;display:block" preserveAspectRatio="none">`;
  [0,.5,1].forEach(p=>{const y=pT+cH-p*cH;s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="rgba(26,56,108,.5)" stroke-width=".5" stroke-dasharray="3 3"/><text x="${pL-3}" y="${y+4}" text-anchor="end" font-size="8" fill="#6688A4">${Math.round(p*max)}</text>`;});
  data.forEach((d,i)=>{const val=d[vk]||0,bh=val>0?(val/max)*cH:0,x=pL+i*bG+(bG-bW)/2,y=pT+cH-bh,lbl=String(d[lk]||"").slice(0,7);if(bh>0)s+=`<rect x="${x}" y="${y}" width="${bW}" height="${bh}" fill="${col}" rx="3" opacity=".9"/>`;s+=`<text x="${x+bW/2}" y="${h-pB+14}" text-anchor="middle" font-size="8.5" fill="#6688A4">${esc(lbl)}</text>`;});
  return s+"</svg>";
}
function hbarchart(data,vk,lk,col,h){
  if(!data.length)return"";
  const W=500,lW=170,pR=40,pT=4,bAW=W-lW-pR,rH=(h-pT)/data.length,max=Math.max(...data.map(d=>d[vk]||0),1);
  let s=`<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px;display:block" preserveAspectRatio="none">`;
  data.forEach((d,i)=>{const val=d[vk]||0,bw=val>0?(val/max)*bAW:0,y=pT+i*rH,lbl=String(d[lk]||"").replace(/_/g," ").slice(0,22);s+=`<text x="${lW-4}" y="${y+rH/2+4}" text-anchor="end" font-size="9" fill="#6688A4">${esc(lbl)}</text>`;if(bw>0)s+=`<rect x="${lW}" y="${y+rH*.2}" width="${bw}" height="${rH*.6}" fill="${col}" rx="2" opacity=".9"/>`;s+=`<text x="${lW+bw+4}" y="${y+rH/2+4}" font-size="9" fill="${col}">${val}</text>`;});
  return s+"</svg>";
}
function donut(data,colors,h){
  const total=data.reduce((s,d)=>s+(d.value||0),0);
  if(!total)return`<div style="height:${h}px;display:flex;align-items:center;justify-content:center;color:var(--t1);font-size:12px">No data</div>`;
  const R=52,r=32,CX=75,CY=h/2;
  let angle=-Math.PI/2,s=`<svg viewBox="0 0 280 ${h}" style="width:100%;max-width:300px;height:${h}px;display:block" preserveAspectRatio="xMidYMid meet">`;
  data.forEach((d,i)=>{if(!d.value)return;const pct=d.value/total,sa=angle;angle+=pct*2*Math.PI;const ea=angle,lg=pct>.5?1:0,ox1=CX+R*Math.cos(sa),oy1=CY+R*Math.sin(sa),ox2=CX+R*Math.cos(ea),oy2=CY+R*Math.sin(ea),ix1=CX+r*Math.cos(sa),iy1=CY+r*Math.sin(sa),ix2=CX+r*Math.cos(ea),iy2=CY+r*Math.sin(ea);s+=`<path d="M ${ox1} ${oy1} A ${R} ${R} 0 ${lg} 1 ${ox2} ${oy2} L ${ix2} ${iy2} A ${r} ${r} 0 ${lg} 0 ${ix1} ${iy1} Z" fill="${colors[i]}" opacity=".9"/>`;});
  data.forEach((d,i)=>{s+=`<circle cx="145" cy="${h/2-20+i*28}" r="5" fill="${colors[i]}"/><text x="154" y="${h/2-15+i*28}" font-size="9" fill="#6688A4">${esc(d.name)}: <tspan fill="#E2EEF8">${d.value}</tspan></text>`;});
  return s+"</svg>";
}

  if(!S.bsv)return`<div class="pg-label">Survey Builder</div><div class="pg-title">No survey selected</div><div style="margin-top:14px">${B("Back to Surveys","nav('surveys')","ghost")}</div>`;
  const qs=S.bqs;
  return`<div class="toolbar"><div><div class="pg-label">Survey Builder</div><div class="pg-title">${esc(S.bsv.title)}</div></div><div class="tl">${B(S.bpv?"Edit":"Preview","ss({bpv:!S.bpv})","ghost")}${B("Save Survey","saveBld()")}${B("Back","nav('surveys')","ghost")}</div></div>
  ${!S.bpv?`<div id="qlist">${qs.map((q,i)=>`<div class="qc" draggable="true" data-i="${i}" ondragstart="dgs(event,${i})" ondragover="dgo(event,${i})" ondrop="ddr(event,${i})" ondragend="dge()"><div class="qch"><span class="dh">⋮⋮</span><span class="qn">Q${i+1}</span><select class="inp" style="width:auto;padding:4px 8px;font-size:11px" onchange="uQ(${i},'type',this.value)">${QT.map(t=>`<option${q.type===t?" selected":""}>${t}</option>`).join("")}</select><label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t1);margin-left:auto;cursor:pointer"><input type="checkbox"${q.required?" checked":""} onchange="uQ(${i},'required',this.checked)"> Required</label><button class="qrm" onclick="rmQ(${i})">x</button></div><input class="inp inp-full" value="${esc(q.label)}" placeholder="Question label..." oninput="uQ(${i},'label',this.value)">${["multiple_choice","checkboxes","dropdown"].includes(q.type)?`<div style="margin-top:8px"><span style="font-size:11px;color:var(--t1)">Options (comma-separated)</span><input class="inp inp-full" style="margin-top:5px" value="${esc((q.options||[]).join(", "))}" oninput="uQO(${i},this.value)"></div>`:""}</div>`).join("")}</div>${B("+ Add Question","addQ()","ghost")}`:
  `<div class="mp"><div style="font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:800;color:#0A1628;margin-bottom:16px">${esc(S.bsv.title)}</div>${qs.map((q,i)=>`<div class="mpq"><div class="mpql">${i+1}. ${esc(q.label)}${q.required?`<span style="color:#E05252"> *</span>`:""}</div>${q.type==="text"?`<div class="mpqinp">Short answer...</div>`:q.type==="yes_no"?`<div style="display:flex;gap:8px"><div class="mpqinp" style="padding:6px 18px">Yes</div><div class="mpqinp" style="padding:6px 18px">No</div></div>`:q.type==="rating"?`<div style="font-size:18px">* * * * *</div>`:q.type==="gps"?`<div class="mpqinp" style="color:#007A58;background:#E8FAF5">📍 Auto-detect</div>`:`<div class="mpqinp">${esc(q.type)}</div>`}</div>`).join("")}${!qs.length?`<div style="text-align:center;color:#7A8A9E;font-size:12px;padding:20px">No questions yet.</div>`:""}</div>`}`;
}

function pAnalytics(){
  const sel=S.ansel||S.surveys[0]?.title||"";
  return`<div class="pg-label">Analytics</div><div class="pg-title">AI Analytics</div><div class="pg-sub">AI analyses all submissions including WhatsApp self-admin responses.</div>
  <div style="display:flex;gap:12px;margin-bottom:18px"><select class="inp" style="flex:1;max-width:420px" onchange="S.ansel=this.value">${S.surveys.map(s=>`<option${(S.ansel||S.surveys[0]?.title)===s.title?" selected":""}>${esc(s.title)}</option>`).join("")}</select>${B(S.anld?"Analysing...":"Analyse","runAn()",undefined,false,S.anld)}</div>
  <div style="font-size:12px;color:var(--t1);margin-bottom:16px">${S.submissions.filter(s=>s.survey===sel).length} submissions for this survey</div>
  ${S.anerr?`<div style="color:var(--red);font-size:12px;margin-bottom:16px">${esc(S.anerr)}</div>`:""}
  ${S.anld?`<div class="empty-card"><div class="spin"></div><div style="margin-top:14px">Analysing submissions...</div></div>`:""}
  ${S.anrep&&!S.anld?`<div class="ai-result" style="margin-bottom:16px"><div class="card-ttl">Executive Summary</div><p style="font-size:14px;color:var(--t0);line-height:1.75">${esc(S.anrep.summary)}</p>${S.anrep.regional_pattern?`<p style="font-size:13px;color:var(--t1);margin-top:8px;font-style:italic">📍 ${esc(S.anrep.regional_pattern)}</p>`:""}</div>
  <div style="display:flex;gap:14px;margin-bottom:16px"><div class="stat"><div class="stat-lbl">Avg Sentiment</div><div class="stat-val" style="color:${sc(S.anrep.avg_sentiment)}">${S.anrep.avg_sentiment}%</div></div><div class="stat"><div class="stat-lbl">Safety Issues</div><div class="stat-val" style="color:${S.anrep.safety_issues>0?"var(--red)":"var(--green)"}">${S.anrep.safety_issues}</div></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="card"><div class="card-ttl">Key Findings</div>${S.anrep.key_findings.map((f,i)=>`<div style="display:flex;gap:10px;margin-bottom:12px;font-size:13px;color:var(--t0);line-height:1.6"><span style="color:var(--blue);font-weight:800;flex-shrink:0;font-family:'Bricolage Grotesque',sans-serif">0${i+1}</span>${esc(f)}</div>`).join("")}</div><div class="card"><div class="card-ttl">Recommendations</div>${S.anrep.recommendations.map(r=>`<div style="display:flex;gap:10px;margin-bottom:12px;font-size:13px;color:var(--t0);line-height:1.6"><span style="color:var(--amber);font-weight:800;flex-shrink:0">→</span>${esc(r)}</div>`).join("")}</div></div>`:""}`;
}

function pAskData(){
  const dc=`Surveys: ${S.surveys.map(s=>`"${s.title}"(${s.status},${s.submissions||0}sub)`).join("|")}\nSubmissions: ${S.submissions.length} total, ${S.submissions.filter(s=>s.source==="whatsapp_selfadmin"||s.enumerator==="Self-admin").length} self-admin, ${S.submissions.filter(s=>s.flagged).length} flagged\nEnumerators: ${S.enumerators.map(e=>`${e.name}(${e.region},${e.status})`).join("|")}`;
  window._dc=dc;
  const sugg=["Which survey has the most responses?","How many self-admin responses?","Most common operational challenge?","Summarise entrepreneur research findings so far"];
  return`<div class="pg-label">Ask Data</div><div class="pg-title">Natural Language Query</div><div class="pg-sub">Ask questions about your field data in plain English.</div>
  <div class="chips">${sugg.map(s=>`<button class="chip" onclick="askD(${JSON.stringify(s)})">${esc(s)}</button>`).join("")}</div>
  <div class="chat-wrap"><div class="msgs" id="msgs">${S.chat.map(m=>`<div class="msg ${m.r==="user"?"msg-u":"msg-b"}" style="align-self:${m.r==="user"?"flex-end":"flex-start"}">${esc(m.t)}</div>`).join("")}${S.cld?`<div class="msg msg-b"><div class="spin" style="width:16px;height:16px;border-width:2px"></div></div>`:""}</div>
  <div class="ci"><input class="inp" id="ci" placeholder="Ask anything about your field data..." value="${esc(S.ci)}" oninput="S.ci=this.value" onkeydown="if(event.key==='Enter')askD()" style="flex:1">${B("Send","askD()")}</div></div>`;
}

function rSidebar(){
  const flc=S.submissions.filter(s=>s.flagged).length;
  const syncStatus=()=>{
    if(S.fbError)return`<span style="color:var(--red)">Error syncing</span>`;
    if(S.syncing)return`<span style="color:var(--amber)">Syncing...</span>`;
    if(S.lastSynced){const sec=Math.round((Date.now()-S.lastSynced)/1000);return`<span style="color:var(--green)">Synced ${sec<5?"just now":sec+"s ago"}</span>`;}
    return"";
  };
  const navs=[
    {id:"overview",ic:"◈",lb:"Overview",g:"Main"},
    {id:"surveys",ic:"📋",lb:"Surveys"},
    {id:"submissions",ic:"📥",lb:"Submissions",bdg:flc},
    {id:"map",ic:"🗺",lb:"Field Map"},
    {id:"enumerators",ic:"👥",lb:"Enumerators"},
    {id:"aibuilder",ic:"✦",lb:"AI Builder",g:"AI Tools"},
    {id:"builder",ic:"✏",lb:"Survey Builder"},
    {id:"analytics",ic:"◉",lb:"AI Analytics"},
    {id:"askdata",ic:"💬",lb:"Ask Data"},
  ];
  let html=`<div class="sb-brand"><div class="sb-logo-text"><div class="sb-logo">Baseline</div><div class="sb-sub"><a href="https://redolense.com" target="_blank">by Redolense</a></div></div><div style="display:flex;gap:4px"><button class="sb-toggle" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">☀</button><button class="sb-toggle" onclick="toggleSb()" title="Collapse sidebar">&#8644;</button></div></div>`;
  if(S.fbError)html+=`<div class="banner banner-err"><strong>Firebase error</strong><div style="font-size:10px;margin-top:2px">${esc(S.fbError)}</div></div>`;
  html+=`<div class="nav-list">`;
  let lastG="";
  navs.forEach(n=>{
    if(n.g&&n.g!==lastG){html+=`<div class="nav-section">${n.g}</div>`;lastG=n.g;}
    html+=`<button class="nav-btn${S.page===n.id?" active":""}" onclick="nav('${n.id}')"><span class="nav-icon">${n.ic}</span><span class="nav-label">${n.lb}</span>${n.bdg?`<span class="nav-badge">${n.bdg}</span>`:""}</button>`;
  });
  html+=`</div><div class="sb-footer"><div>A Redolense product</div><div class="sb-sync">${syncStatus()}</div><button class="sb-refresh" onclick="fetchAll()">Refresh now</button></div>`;
  return html;
}

function toggleSb(){document.querySelector('.app').classList.toggle('sb-closed');}
function toggleTheme(){
  const isLight=document.documentElement.classList.toggle('light');
  document.getElementById('themeBtn').textContent=isLight?'☽':'☀';
  localStorage.setItem('bl-theme',isLight?'light':'dark');
}
// Restore saved theme
if(localStorage.getItem('bl-theme')==='light'){
  document.documentElement.classList.add('light');
  document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('themeBtn');if(b)b.textContent='☽';});
}
function render(){
  document.getElementById("sidebar").innerHTML=rSidebar();
  document.getElementById("main").innerHTML=renderPage();
  const msgs=document.getElementById("msgs");if(msgs)msgs.scrollTop=msgs.scrollHeight;
}
function renderPage(){
  if(S.loading)return`<div class="loading-wrap"><div class="spin"></div><div>Connecting to Firebase...</div></div>`;
  switch(S.page){case"overview":return pOverview();case"surveys":return pSurveys();case"submissions":return pSubmissions();case"map":return pMap();case"enumerators":return pEnumerators();case"aibuilder":return pAIBuilder();case"builder":return pBuilder();case"analytics":return pAnalytics();case"askdata":return pAskData();}return"";
}

function nav(pg){Object.assign(S,{page:pg,search:"",filter:"all",tab:"All"});render();}
function openNS(){Object.assign(S,{showNS:true,nst:"",nsd:""});render();}
function openAE(){Object.assign(S,{showAE:true,nen:"",nee:"",ner:"Nairobi"});render();}
async function crtSurvey(){if(!S.nst.trim())return;const o={title:S.nst,description:S.nsd,status:"Draft",version:"v1.0",submissions:0,questions:0,created:new Date().toISOString().split("T")[0]};try{const sv=await FB.create("surveys",o);S.surveys.push(sv);}catch{S.surveys.push({...o,_id:Date.now().toString()});}Object.assign(S,{showNS:false,nst:"",nsd:""});render();}
async function pubSurvey(id){try{await FB.patch("surveys",id,{status:"Published"});}catch{}S.surveys=S.surveys.map(s=>s._id===id?{...s,status:"Published"}:s);render();}
async function archSurvey(id){try{await FB.patch("surveys",id,{status:"Archived"});}catch{}S.surveys=S.surveys.map(s=>s._id===id?{...s,status:"Archived"}:s);render();}
function dupSurvey(id){const s=S.surveys.find(x=>x._id===id);if(!s)return;const c={...s,title:s.title+" (copy)",status:"Draft",submissions:0,_id:undefined};FB.create("surveys",c).then(sv=>{S.surveys.push(sv);render();}).catch(()=>{S.surveys.push({...c,_id:Date.now().toString()});render();});}
function openBld(id){const s=S.surveys.find(x=>x._id===id);Object.assign(S,{page:"builder",bsv:s,bqs:[],bpv:false});render();}
function addQ(){S.bqs.push({id:Date.now(),type:"text",label:"New question",required:false,options:[]});render();}
function rmQ(i){S.bqs.splice(i,1);render();}
function uQ(i,k,v){S.bqs[i][k]=v;render();}
function uQO(i,v){S.bqs[i].options=v.split(",").map(s=>s.trim()).filter(Boolean);render();}
let _di=null;
function dgs(e,i){_di=i;}
function dgo(e,i){e.preventDefault();if(_di===null||_di===i)return;const[m]=S.bqs.splice(_di,1);S.bqs.splice(i,0,m);_di=i;render();}
function ddr(e,i){e.preventDefault();}
function dge(){_di=null;}
async function saveBld(){const s=S.bsv;if(s&&s._id){try{await FB.patch("surveys",s._id,{questions:S.bqs.length});}catch{}}S.surveys=S.surveys.map(sv=>sv._id===s?._id?{...sv,questions:S.bqs.length}:sv);render();alert("Saved");}
async function togFlag(id,val){try{await FB.patch("submissions",id,{flagged:val});}catch{}S.submissions=S.submissions.map(s=>s._id===id?{...s,flagged:val}:s);render();}
async function togEnum(id,status){try{await FB.patch("enumerators",id,{status});}catch{}S.enumerators=S.enumerators.map(e=>e._id===id?{...e,status}:e);render();}
async function addEnum(){if(!S.nen||!S.nee)return;const o={name:S.nen,email:S.nee,region:S.ner,status:"Active",submissions:0,joined:new Date().toISOString().split("T")[0],lat:-1.286,lon:36.817};try{const sv=await FB.create("enumerators",o);S.enumerators.push(sv);}catch{S.enumerators.push({...o,_id:Date.now().toString()});}Object.assign(S,{showAE:false,nen:"",nee:""});render();}
function setAIIntent(i){const ex=["Research the operational problems Kenyan restaurant owners face with WhatsApp follow-up","Survey to understand why Kenyan entrepreneurs fail to convert TikTok viewers into paying clients","Kenya entrepreneur pain points: stock tracking, cash flow, staff, WhatsApp overload"];S.aint=ex[i];render();}

async function genSurvey(){
  if(!S.aint.trim())return;
  Object.assign(S,{ald:true,aerr:"",ares:null,asv:false});render();
  try{
    const text=await aiCall(`You are a Kenya/East Africa field research survey designer. Return ONLY a raw JSON object, no markdown: {"title":"string","description":"string","questions":[{"type":"text","label":"string","required":true,"options":[]}]} Types: text paragraph multiple_choice checkboxes rating yes_no number date photo gps dropdown. Options only for multiple_choice/checkboxes/dropdown. Include one gps question. 8-14 questions. Kenya context.`,[{role:"user",content:S.aint}],2000);
    const raw=text.trim().replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
    const s=raw.indexOf("{"),e=raw.lastIndexOf("}");
    const parsed=JSON.parse(raw.slice(s,e+1));
    if(!parsed.questions||!Array.isArray(parsed.questions))throw new Error("Invalid response");
    Object.assign(S,{ares:parsed,ald:false});
  }catch(e){Object.assign(S,{aerr:e.message,ald:false});}
  render();
}

async function saveAIRes(){
  if(!S.ares)return;
  const o={title:S.ares.title,description:S.ares.description||"",status:"Draft",version:"v1.0",submissions:0,questions:S.ares.questions.length,created:new Date().toISOString().split("T")[0]};
  try{const sv=await FB.create("surveys",o);S.surveys.push(sv);}catch{S.surveys.push({...o,_id:Date.now().toString()});}
  S.asv=true;render();
}

async function runAn(){
  const sel=S.ansel||S.surveys[0]?.title||"";S.ansel=sel;
  Object.assign(S,{anld:true,anerr:"",anrep:null});render();
  const subs=S.submissions.filter(s=>s.survey===sel);
  const ctx=subs.map(s=>`Enumerator:${s.enumerator||"Self-admin"},Location:${s.location||"Unknown"},Sentiment:${s.sentiment||"N/A"}%,Tags:${ntags(s).join(",")},OPS_SLOW:${s.OPS_SLOW||"?"},WTP:${s.WTP_WILLING||"?"}`).join("\n");
  try{
    const text=await aiCall(`You are a field research analyst for East Africa. Return ONLY raw JSON: {"summary":"string","avg_sentiment":number,"top_finding":"string","safety_issues":number,"key_findings":["string","string","string"],"recommendations":["string","string","string"],"regional_pattern":"string"}`,[{role:"user",content:`Survey: ${sel}\n\nSubmissions (${subs.length}):\n${ctx||"No submissions yet."}`}],1200);
    const raw=text.trim().replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
    const s=raw.indexOf("{"),e=raw.lastIndexOf("}");
    Object.assign(S,{anrep:JSON.parse(raw.slice(s,e+1)),anld:false});
  }catch(e){Object.assign(S,{anerr:e.message,anld:false});}
  render();
}

async function askD(q){
  const question=q||S.ci.trim();if(!question)return;
  S.ci="";S.chat.push({r:"user",t:question});
  Object.assign(S,{cld:true});render();
  const msgs=S.chat.filter((m,i)=>m.r!=="b"||i>0).map(m=>({role:m.r==="user"?"user":"assistant",content:m.t}));
  try{
    const text=await aiCall(`You are a field research analyst for the Baseline platform. Answer concisely using this data:\n${window._dc||""}`,msgs,400);
    S.chat.push({r:"b",t:text||"No response."});
  }catch(e){S.chat.push({r:"b",t:`Error: ${e.message}`});}
  Object.assign(S,{cld:false});render();
}

async function fetchAll(initial=false){
  if(!initial)S.syncing=true;
  try{
    const[survs,subs,enums]=await Promise.all([FB.list("surveys"),FB.list("submissions"),FB.list("enumerators")]);
    S.surveys=survs.length?survs:SEED.surveys;
    S.submissions=subs.length?subs:SEED.submissions;
    S.enumerators=enums.length?enums:SEED.enumerators;
    S.lastSynced=Date.now();S.fbError=null;
  }catch(e){console.error("FB:",e);S.fbError=e.message;if(initial){S.surveys=SEED.surveys;S.submissions=SEED.submissions;S.enumerators=SEED.enumerators;}}
  S.syncing=false;S.loading=false;render();
}

render();
fetchAll(true).then(()=>{
  setInterval(()=>fetchAll(),15000);
  setInterval(()=>{S.stk++;document.getElementById("sidebar").innerHTML=rSidebar();},5000);
});
</script>
</body>
</html>

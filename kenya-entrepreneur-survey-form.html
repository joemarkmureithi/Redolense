<!--

  GOOGLE SHEETS INTEGRATION SETUP
  ══════════════════════════════════════════════════════════
  1. Go to script.google.com → New project
  2. Paste the Code.gs contents from the bottom of this file
  3. Click Deploy → New deployment → Web app
  4. Execute as: Me | Who has access: Anyone
  5. Copy the deployment URL
  6. Replace APPS_SCRIPT_URL below with your URL
  ══════════════════════════════════════════════════════════
-->
<script>
/* ═══════════════════════════════════════════════════════════
   FIREBASE CONFIG — same values as the platform
   1. Go to console.firebase.google.com
   2. Project Settings → Your apps → Web app config
   3. Paste apiKey and projectId below
═══════════════════════════════════════════════════════════ */
const FB_CONFIG = {
  apiKey:    "AIzaSyBOvvCdEUNayhvQ54XIXyXuiN2K73yZ71E",
  projectId: "baseline-ke",
};
const FB_READY = !FB_CONFIG.apiKey.startsWith("REPLACE");

async function fbCreate(data) {
  const fields = {};
  Object.entries(data).forEach(([k, v]) => {
    if (v === null || v === undefined) fields[k] = { nullValue: null };
    else if (typeof v === "number" && Number.isInteger(v)) fields[k] = { integerValue: String(v) };
    else if (typeof v === "number") fields[k] = { doubleValue: v };
    else if (typeof v === "boolean") fields[k] = { booleanValue: v };
    else fields[k] = { stringValue: String(v) };
  });
  const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/submissions?key=${FB_CONFIG.apiKey}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `Firebase error ${res.status}`);
  }
  return res.json();
}
</script>

<style>
/* ════════════════════════════════════
   TOKENS
════════════════════════════════════ */

<script>
/* ════════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════ */
const SURVEY = {
  title: "Kenya Entrepreneur Research Challenge",
  subtitle: "Redolens Digital",
  questions: [

    // ── INTRO ──────────────────────────────────────────
    {
      id: "intro",
      type: "intro",
    },

    // ── Q1: SECTOR ─────────────────────────────────────
    {
      id: "SECTOR",
      type: "single",
      title: "What type of business do you run?",
      sub: "Choose the option that fits best.",
      options: [
        { code:1,  label:"Retail / kiosk / duka / hardware" },
        { code:2,  label:"Food & hospitality (restaurant / café / catering)" },

        { code:7,  label:"Professional services (consulting / accounting / training)" },
        { code:8,  label:"Technology / digital / cyber / printing" },
        { code:9,  label:"Healthcare / pharmacy / clinic" },
        { code:88, label:"Other", other:true },
      ],
    },

    // ── Q2: BIZ_AGE ────────────────────────────────────
    {
      id: "BIZ_AGE",
      type: "single",
      title: "How long has this business been running?",
      options: [
        { code:1, label:"Less than 1 year" },
        { code:2, label:"1–3 years" },
        { code:3, label:"4–7 years" },
        { code:4, label:"8–15 years" },
        { code:5, label:"Over 15 years" },
      ],
    },

    // ── Q3: STAFF_TOT ──────────────────────────────────
    {
      id: "STAFF_TOT",
      type: "single",
      title: "How many people work in this business?",
      sub: "Include yourself and any casual workers.",
      options: [
        { code:1, label:"Solo — just me" },
        { code:2, label:"2–5 people" },
        { code:3, label:"6–15 people" },
        { code:4, label:"16–50 people" },
        { code:5, label:"More than 50" },
      ],
    },

    // ── Q4: REV_CH ─────────────────────────────────────
    {
      id: "REV_CH",
      type: "multi",
      max: 2,
      title: "How do most of your customers reach you?",
      sub: "Choose up to 2 main ways.",
      options: [
        { code:1, label:"Walk-in (people come to my premises)" },
        { code:2, label:"WhatsApp (orders or enquiries via WhatsApp)" },
        { code:3, label:"Referrals / word of mouth" },
        { code:4, label:"Social media (Facebook / Instagram / TikTok)" },
        { code:5, label:"Online store / website / Jiji / Jumia" },
        { code:6, label:"Direct sales (I go to the customer)" },
        { code:7, label:"Agent or distributor" },
        { code:88, label:"Other", other:true },
      ],
    },

    // ── Q4b: MPESA ─────────────────────────────────────
    {
      id: "MPESA",
      type: "single",
      title: "Do you use M-Pesa or mobile money to receive payments?",
      options: [
        { code:1, label:"Yes — I use it regularly" },
        { code:2, label:"Yes — sometimes" },
        { code:3, label:"No — I don't use it" },
      ],
    },

    // ── Q5: OPS_SLOW (CORE) ────────────────────────────
    {
      id: "OPS_SLOW",
      type: "single",
      title: "What is the single biggest thing slowing your business down right now?",
      sub: "Choose the one that fits most.",
      core: true,
      options: [
        { code:1, label:"Tracking stock — knowing what I have and what's running low" },
        { code:2, label:"Following up customers who haven't paid or haven't returned" },
        { code:3, label:"Managing orders across WhatsApp, phone, and walk-in" },
        { code:4, label:"Knowing my real profit — I'm not sure how much I'm making" },
        { code:5, label:"Managing staff — attendance, tasks, accountability" },
        { code:6, label:"Getting new customers — marketing and visibility" },
        { code:7, label:"Supplier problems — late deliveries or price changes" },
        { code:8, label:"Cash flow — having money available when I need it" },
        { code:9, label:"Record keeping — receipts, invoices, M-Pesa reconciliation" },
        { code:88, label:"Other", other:true },
      ],
    },

let currentIdx = 0;
let answers    = {};
let gpsData    = { lat: null, lon: null };
let direction  = 1; // 1 = forward, -1 = back

/* ════════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════════ */
function isSkipped(q) {
  return typeof q.skip === "function" && q.skip(answers);
}

function getVisibleQuestions() {
  return SURVEY.questions.filter(q => !isSkipped(q));
}

function getProgress() {
  const visible = getVisibleQuestions();
  const idx = visible.findIndex(q => q.id === SURVEY.questions[currentIdx]?.id);
  const total = visible.filter(q => q.type !== "intro" && q.type !== "success").length;
  const current = Math.max(0, idx);
  return { pct: Math.round((current / total) * 100), label: `${current} / ${total}` };
}

function canProceed(q) {
  if (!q) return true;
  if (q.type === "intro" || q.type === "success") return true;
  if (q.type === "gps_followup") return true;
  if (q.type === "rating_grid") {
    return q.items.every(item => answers[item.id] !== undefined);
  }
  const val = answers[q.id];
  if (q.type === "single" && val === undefined) return false;
  if (q.type === "multi" && (!val || val.length === 0)) return false;
  return true;
}

/* ════════════════════════════════════════════════════════════
   RENDER
════════════════════════════════════════════════════════════ */
function render() {
  const q = SURVEY.questions[currentIdx];
  const viewport = document.getElementById("viewport");
  const progressWrap = document.getElementById("progressWrap");
  const bottomNav = document.getElementById("bottomNav");
  const backBtn = document.getElementById("backBtn");
  const nextBtn = document.getElementById("nextBtn");

  // Remove old screens
  const prev = viewport.querySelector(".screen.active");
  if (prev) {
    prev.classList.remove("active");
    prev.classList.add(direction > 0 ? "hidden-left" : "hidden-right");
    setTimeout(() => prev.remove(), 400);
  }

  // Build new screen
  const screen = document.createElement("div");
  screen.className = "screen hidden-right";
  screen.innerHTML = buildScreen(q);
  viewport.appendChild(screen);

  requestAnimationFrame(() => {
    screen.classList.remove("hidden-right", "hidden-left");
    screen.classList.add("active");
  });

  // Progress
  if (q.type === "intro" || q.type === "success") {
    progressWrap.style.display = "none";
    bottomNav.style.display = "none";
  } else {
    const prog = getProgress();
    progressWrap.style.display = "flex";
    document.getElementById("progressFill").style.width = prog.pct + "%";
    document.getElementById("progressLabel").textContent = prog.label;
    bottomNav.style.display = "flex";
    backBtn.style.visibility = currentIdx > 0 ? "visible" : "hidden";
    updateNextBtn(q);
  }
}

function updateNextBtn(q) {
  const nextBtn = document.getElementById("nextBtn");
  const isLast = SURVEY.questions[currentIdx + 1]?.type === "success"
    || currentIdx === SURVEY.questions.length - 2;
  nextBtn.disabled = !canProceed(q);
  nextBtn.textContent = q.type === "gps_followup" ? "Submit →" : "Continue →";
}

    case "intro":         return buildIntro();
    case "single":        return buildSingle(q);
    case "multi":         return buildMulti(q);
    case "rating_grid":   return buildRatingGrid(q);
    case "gps_followup":  return buildGpsFollowup(q);
    case "success":       return buildSuccess();
    default:              return "";
  }
}

/* ════════════════════════════════════════════════════════════
   INTERACTION HANDLERS
════════════════════════════════════════════════════════════ */
function startSurvey() {
  direction = 1;
  currentIdx = 1;
  render();
}

function goNext() {
  const q = SURVEY.questions[currentIdx];
  if (!canProceed(q)) return;

  if (q.type === "gps_followup") {
    submitSurvey();
    return;
  }

  direction = 1;
  let next = currentIdx + 1;
  while (next < SURVEY.questions.length && isSkipped(SURVEY.questions[next])) next++;
  if (next < SURVEY.questions.length) {
    currentIdx = next;
    render();
  }
}

function goBack() {
  direction = -1;
  let prev = currentIdx - 1;
  while (prev >= 0 && isSkipped(SURVEY.questions[prev])) prev--;
  if (prev >= 0) {
    currentIdx = prev;
    render();
  }
}

function selectSingle(id, code, isOther) {
  answers[id] = code;
  // Show/hide other inputs
  document.querySelectorAll(`#opts_${id} .opt`).forEach(el => {
    el.classList.toggle("selected", parseInt(el.dataset.code) === code);
  });
  const otherEl = document.getElementById(`other_${id}`);
  if (otherEl) otherEl.classList.toggle("show", isOther && code === parseInt(otherEl.parentElement?.previousElementSibling?.dataset?.code || "0") || isOther);
  updateNextBtn(SURVEY.questions[currentIdx]);
}

function toggleMulti(id, code, max, isOther) {
  if (!answers[id]) answers[id] = [];
  const arr = answers[id];
  const idx = arr.indexOf(code);
  if (idx >= 0) {
    arr.splice(idx, 1);
  } else {
    if (arr.length >= max) return;
    arr.push(code);
  }
  const q = SURVEY.questions[currentIdx];
  const badge = document.getElementById(`multiBadge_${id}`);
  if (badge) badge.textContent = `Select up to ${max} · ${arr.length} chosen`;
  document.querySelectorAll(`#opts_${id} .opt`).forEach(el => {
    el.classList.toggle("selected", arr.includes(parseInt(el.dataset.code)));
  });
  updateNextBtn(q);
}

function toggleCheckbox(id, code, max, isOther) {
  if (!answers[id]) answers[id] = [];
  const arr = answers[id];
  const idx = arr.indexOf(code);
  if (idx >= 0) {
    arr.splice(idx, 1);
  } else {
    arr.push(code);
  }
  const q = SURVEY.questions[currentIdx];
  document.querySelectorAll(`#opts_${id} .opt`).forEach(el => {
    const c = parseInt(el.dataset.code);
    el.classList.toggle("selected", arr.includes(c));
    const sq = el.querySelector(".opt-sq");
    if (sq) sq.textContent = arr.includes(c) ? "✓" : "";
  });
  const otherEl = document.getElementById(`other_${id}`);
  if (otherEl) otherEl.classList.toggle("show", arr.includes(88));
  updateNextBtn(q);
}

function rateSeverity(itemId, value) {
  answers[itemId] = value;
  document.querySelectorAll(`[onclick="rateSeverity('${itemId}', ${1})"]`)
    .forEach((_, i) => {});
  // Re-render the grid item
  const allDots = document.querySelectorAll(`.sev-item`);
  const q = SURVEY.questions[currentIdx];
  if (!q || q.type !== "rating_grid") return;
  const item = q.items.find(it => it.id === itemId);
  if (!item) return;
  const itemEls = Array.from(allDots).find(el =>
    el.querySelector(".sev-label")?.textContent === item.label
  );
  if (!itemEls) return;
  itemEls.querySelectorAll(".sev-dot").forEach((dot, i) => {
    dot.classList.toggle("selected", i + 1 === value);
  });
  updateNextBtn(q);
}

function selectFollowup(val) {
  answers["FOLLOWUP"] = val;
  render(); // re-render to show/hide contact input
}

/* ════════════════════════════════════════════════════════════
   GPS CAPTURE
════════════════════════════════════════════════════════════ */
function captureGps() {
  if (!navigator.geolocation) {
    alert("GPS not supported on this device.");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      gpsData.lat = pos.coords.latitude;
      gpsData.lon = pos.coords.longitude;
      render();
    },
    err => {
      console.warn("GPS error:", err);
      gpsData.lat = 0;
      gpsData.lon = 0;
      render();
    },
    { enableHighAccuracy:true, timeout:10000 }
  );
}

/* ════════════════════════════════════════════════════════════
   SUBMIT
════════════════════════════════════════════════════════════ */
function formatAnswers() {
  const d = { ...answers };
  d.GPS_LAT   = gpsData.lat || "";
  d.GPS_LON   = gpsData.lon || "";
  d.TIMESTAMP = new Date().toISOString();
  // Flatten arrays
  ["REV_CH","LOSS","MANUAL","TRIED"].forEach(k => {
    if (Array.isArray(d[k])) d[k] = d[k].join("|");
  });
  // Flatten severity items
  const sevQ = SURVEY.questions.find(q => q.id === "SEV");
  if (sevQ) sevQ.items.forEach(item => { d[item.id] = answers[item.id] || ""; });
  delete d["SEV"];
  return d;
}

async function retrySubmit() {
  document.getElementById("errorOverlay").classList.remove("show");
  await submitSurvey();
}

async function submitSurvey() {
  const payload = formatAnswers();
  payload.survey        = "Kenya Entrepreneur Research Challenge";
  payload.survey_id     = "kenya-entrepreneur-research-challenge";
  payload.source        = "whatsapp_selfadmin";
  payload.enumerator    = "Self-admin";

  // Derive a rough sentiment score from SEV ratings (lower avg severity = higher satisfaction)
  const sevKeys = ["SEV_1","SEV_2","SEV_3","SEV_4","SEV_5","SEV_6","SEV_7"];
  const sevVals = sevKeys.map(k=>Number(answers[k]||0)).filter(v=>v>0);
  if (sevVals.length > 0) {
    const avgSev = sevVals.reduce((a,b)=>a+b,0)/sevVals.length;
    payload.sentiment = Math.round(((5-avgSev)/4)*100);
  }

  // Derive tags from OPS_SLOW
  const OPS_TAG = {1:"stock_tracking_issue",2:"customer_followup_gap",3:"multichannel_chaos",4:"profit_visibility_gap",5:"staff_management",6:"acquisition_problem",7:"supplier_issue",8:"cash_flow_problem",9:"recordkeeping_chaos"};
  const slowCode = answers["OPS_SLOW"];
  payload.tags = slowCode && OPS_TAG[slowCode] ? OPS_TAG[slowCode] : "";
  payload.flagged = false;
  payload.media   = 0;

  if (!FB_READY) {
    // Demo mode — no Firebase configured yet
    await new Promise(r => setTimeout(r, 1400));
    direction = 1;
    currentIdx = SURVEY.questions.length - 1;
    render();
    return;
  }

  document.getElementById("loadingOverlay").classList.add("show");
  try {
    await fbCreate(payload);
    document.getElementById("loadingOverlay").classList.remove("show");
    direction = 1;
    currentIdx = SURVEY.questions.length - 1;
    render();
  } catch(e) {
    document.getElementById("loadingOverlay").classList.remove("show");
    document.getElementById("errorMsg").textContent = e.message || "Firebase submission failed.";
    document.getElementById("errorOverlay").classList.add("show");
  }
}

/* ════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════ */
render();
</script>

      .createTextOutput(JSON.stringify({ success: false, error: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}
